name: Continuos Integration(Linter e Tests)

on:
  push:
    branches: ["main", "develop", "chore/pipeline-exec-testes"]

  pull_request:
    branches: ["main", "develop"]

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      python: ${{ steps.filter.outputs.python }}
      nextjs: ${{ steps.filter.outputs.nextjs }}

    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**/*.py'
              - 'backend/requirements.txt'
            frontend:
              - 'frontend/**/*.js'
              - 'frontend/**/*.ts'
              - 'frontend/**/*.tsx'
              - 'frontend/package.json'


  lint:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Ruff
        if: ${{ needs.changes.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@v3
        with:
          args: "check backend/"

      - name: Ruff Format
        if: ${{ needs.changes.outputs.python == 'true' }}
        uses: astral-sh/ruff-action@v3
        with:
          args: "ruff format --check backend/"

      - name: Setup Node.js
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '19'

      - name: Install Dependecias frontend
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Lint(JS/TS)
        if: ${{ needs.changes.outputs.nextjs == 'true' }}
        working-directory: ./frontend
        run: npm run lint

  tests:
    needs: [changes, lint]
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependecias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests backend
        working-directory: ./backend
        run: python manage.py test






